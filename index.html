<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>ఆంధ్రమహాభారతము — Reader</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a3a20">
<meta name="description" content="Andhra Mahabharatham padyam reader">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- iOS: run as a standalone app when added to the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="మహాభారతము">

<!-- Reader fonts: NTR and Mandali (Telugu), selectable in the sidebar; Mandali is the default -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mandali&family=NTR&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #1b140d;
    --paper: #fbf3e2;
    --paper-soft: #f4e9d0;
    --ink: #2a1e12;
    --ink-soft: #6b5940;
    --rust: #b5502f;
    --rust-dark: #8a3a20;
    --gold: #c79a3f;
    --leaf: #566b45;
    --line: #d9c69b;
    --shadow: 0 6px 24px rgba(0,0,0,0.35);
    --verse-size: 1.15rem;
    --header-h: 84px;
    --nav-h: 64px;
    --reader-font: 'Mandali';
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: var(--bg);
    font-family: Georgia, 'Noto Serif Telugu', serif;
    color: var(--ink);
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- Fixed header ---------- */
  header{
    position:relative; z-index:20;
    height: calc(var(--header-h) + env(safe-area-inset-top));
    flex: 0 0 auto;
    background: linear-gradient(180deg, var(--rust) 0%, var(--rust-dark) 100%);
    color: #fdf3e2;
    display:flex; flex-direction:column; justify-content:center;
    padding: calc(8px + env(safe-area-inset-top)) 12px 10px;
    box-shadow: var(--shadow);
  }
  .hdr-row{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    background:none; border:none; color:#fdf3e2; font-size:1.4rem;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; border-radius:50%; flex:0 0 auto;
  }
  .icon-btn:active{ background: rgba(255,255,255,0.15); }
  .hdr-title{
    flex:1; text-align:center; font-size:1.15rem; letter-spacing:0.5px;
    font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hdr-sub{
    margin-top: 3px;
    text-align:center; font-size: 0.8rem; color: #f2dcb8;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    padding: 0 6px;
  }

  /* ---------- Away-from-primary-bookmark banner ---------- */
  #awayBanner{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#4a3319; color:#f4e3c0; padding:8px 14px; font-size:0.82rem; z-index:15;
  }
  #awayBanner span{ flex:1 1 auto; min-width:0; }
  #awayBanner button{
    background:var(--gold); color:#2a1e12; border:none; padding:7px 12px; border-radius:6px;
    font-size:0.8rem; font-weight:bold; cursor:pointer; white-space:nowrap; font-family:inherit;
    flex:0 0 auto;
  }

  /* ---------- Side drawer ---------- */
  #overlay{
    position:fixed; inset:0; background: rgba(0,0,0,0.45);
    opacity:0; pointer-events:none; transition: opacity 0.25s ease; z-index:30;
  }
  #overlay.show{ opacity:1; pointer-events:auto; }
  #drawer{
    position:fixed; top:0; bottom:0; left:0; width: min(320px, 84vw);
    background: var(--paper); z-index:31;
    transform: translateX(-105%); transition: transform 0.28s ease;
    display:flex; flex-direction:column;
    box-shadow: 4px 0 20px rgba(0,0,0,0.3);
  }
  #drawer.show{ transform: translateX(0); }
  .drawer-hdr{
    padding: calc(18px + env(safe-area-inset-top)) 16px 12px; background: var(--rust); color:#fff;
    display:flex; justify-content:space-between; align-items:center;
  }
  .drawer-hdr b{ font-size:1.05rem; }
  .drawer-body{ flex:1; overflow-y:auto; padding: 10px 0 20px; }
  .drawer-section{ padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .drawer-section h4{
    margin:0 0 8px; font-size:0.72rem; letter-spacing:1px; text-transform:uppercase;
    color: var(--rust-dark);
  }
  .font-controls{ display:flex; align-items:center; gap:10px; }
  .font-controls button{
    width:36px; height:36px; border-radius:6px; border:1px solid var(--rust);
    background:#fff; color:var(--rust-dark); font-size:1rem; cursor:pointer;
  }
  .font-controls span{ font-size:0.85rem; color:var(--ink-soft); min-width:40px; text-align:center; }

  .pill-toggle{ display:flex; gap:8px; }
  .pill-btn{
    flex:1; padding:9px 6px; border-radius:8px; border:1px solid var(--rust);
    background:#fff; color:var(--rust-dark); font-size:0.85rem; cursor:pointer; font-family:inherit;
  }
  .pill-btn.active{ background:var(--rust); color:#fff; }

  /* ---------- Nav tree: parva > aswasam > topic ---------- */
  .nav-tree{ font-size:0.88rem; }
  .nav-tree details{ border-bottom: 1px dashed var(--line); }
  .nav-tree details:last-child{ border-bottom:none; }
  .nav-tree summary{
    list-style:none; cursor:pointer; padding:9px 4px;
    display:flex; align-items:center; gap:6px; color:var(--ink);
  }
  .nav-tree summary::-webkit-details-marker{ display:none; }
  .nav-tree summary::before{
    content:'▸'; display:inline-block; flex:0 0 auto; width:12px;
    color:var(--rust-dark); transition: transform 0.15s ease;
  }
  .nav-tree details[open] > summary::before{ transform: rotate(90deg); }
  .nav-parva > summary{ font-weight:bold; color:var(--rust-dark); font-size:0.95rem; }
  .nav-aswasam{ margin-left:16px; }
  .nav-aswasam > summary{ font-weight:600; }
  .nav-label{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-count{ flex:0 0 auto; color:var(--ink-soft); font-size:0.78rem; }
  .nav-topics{ list-style:none; margin:0 0 4px; padding:0 0 0 28px; }
  .nav-topics li{
    padding: 7px 6px; border-radius:4px; cursor:pointer;
    display:flex; align-items:center; gap:6px; color:var(--ink-soft);
  }
  .nav-topics li:active{ background: var(--paper-soft); }
  .nav-topics li.current{ background: var(--paper-soft); font-weight:bold; color:var(--rust-dark); }
  .nav-topics li.current .nav-count{ color:var(--rust-dark); }
  .empty-note{ color: var(--ink-soft); font-size:0.82rem; padding: 4px 6px; }
  .drawer-btn{
    width:100%; text-align:left; background:none; border:none; padding:9px 6px;
    font-size:0.9rem; color: var(--rust-dark); cursor:pointer; font-family:inherit;
  }

  /* ---------- Stage ---------- */
  #stage{
    position:relative; flex:1; overflow:hidden;
    background:
      radial-gradient(ellipse at top, #2a2015 0%, var(--bg) 60%);
  }
  #track{
    position:absolute; inset:0;
    display:flex;
    will-change: transform;
  }
  .screen{
    flex: 0 0 100%; width:100%; height:100%;
    display:flex; flex-direction:column;
    padding: 10px 4px 0;
  }
  .verse-pane{
    flex: 1 1 55%; min-height: 0;
    background: var(--paper);
    margin: 0 10px; border-radius: 10px 10px 0 0;
    box-shadow: var(--shadow);
    overflow-y:auto; padding: 18px 18px 14px;
    -webkit-overflow-scrolling: touch;
  }
  .verse-meta{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .verse-badge{
    background: var(--leaf); color:#fff; font-size:0.72rem; font-weight:bold;
    padding: 3px 10px; border-radius: 12px;
  }
  .verse-type{ color: var(--rust-dark); font-weight:bold; font-size:0.85rem; }
  .verse-star{
    margin-left:auto; background:none; border:none; font-size:1.3rem; cursor:pointer;
    color: var(--gold); opacity:0.4;
  }
  .verse-star.on{ opacity:1; }
  .verse-part + .verse-part{ margin-top: 14px; }
  .verse-part .ptype{ font-size:0.78rem; color:var(--ink-soft); margin-bottom:2px; }
  .verse-text{
    font-family: var(--reader-font), 'Noto Serif Telugu', serif;
    font-size: var(--verse-size); line-height:1.75; white-space:pre-line;
  }

  .meaning-pane{
    flex: 1 1 45%; min-height:0; display:flex; flex-direction:column;
    background: var(--paper-soft);
    margin: 0 10px; border-radius: 0 0 10px 10px;
    box-shadow: var(--shadow);
    padding: 12px 18px 14px;
    border-top: 2px dashed var(--line);
  }
  .meaning-tabs{ flex:0 0 auto; display:flex; gap:6px; margin-bottom:10px; }
  .meaning-tab-btn{
    flex:1; padding:7px 4px; border-radius:6px; border:1px solid var(--rust);
    background:#fff; color:var(--rust-dark); font-size:0.8rem; cursor:pointer; font-family:inherit;
  }
  .meaning-tab-btn.active{ background:var(--rust); color:#fff; }
  .meaning-content{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling: touch; }
  .meaning-text{
    font-family: var(--reader-font), 'Noto Serif Telugu', serif;
    font-size:0.98rem; line-height:1.6; color: var(--ink); white-space:pre-line;
  }
  .meaning-empty{ font-size:0.88rem; color: var(--ink-soft); font-style:italic; }

  .resize-handle{
    flex:0 0 auto; height:14px; margin: 0 10px; cursor:ns-resize;
    display:flex; align-items:center; justify-content:center;
    background: var(--paper-soft);
  }
  .resize-handle::before{
    content:""; width:36px; height:4px; border-radius:2px; background: var(--line);
  }

  /* ---------- Topic-wise screen (verse text only — no ardha/bhava/visesha) ---------- */
  .topic-scroll{
    flex:1; min-height:0; overflow-y:auto; background: var(--paper);
    margin: 0 10px 10px; border-radius: 10px; box-shadow: var(--shadow);
    padding: 18px 18px 22px; -webkit-overflow-scrolling: touch;
  }
  .topic-hdr{
    font-weight:bold; color:var(--rust-dark); margin-bottom:14px; font-size:1rem;
    border-bottom:2px dashed var(--line); padding-bottom:8px;
  }
  .topic-block + .topic-block{ margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }

  /* ---------- Bottom nav ---------- */
  #bottomnav{
    flex:0 0 auto; height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    background: #150f0a; color:#f2e3c5;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 10px calc(env(safe-area-inset-bottom)) 10px; z-index:20;
  }
  #bottomnav button{
    background:none; border:none; color:#f2e3c5; font-size:1rem; cursor:pointer;
    padding: 8px 14px; border-radius:6px; display:flex; align-items:center; gap:6px;
  }
  #bottomnav button:disabled{ opacity:0.3; }
  #bottomnav button:active:not(:disabled){ background: rgba(255,255,255,0.1); }
  #progress{ font-size:0.78rem; color:#c9b98c; text-align:center; }
  #progress b{ color:#f2e3c5; }

  /* ---------- Search / Starred overlays (shared shell) ---------- */
  #searchOverlay, #starredOverlay{
    position:fixed; inset:0; background: var(--bg); z-index:40;
    display:flex; flex-direction:column;
    transform: translateY(-100%); transition: transform 0.25s ease;
  }
  #searchOverlay.show, #starredOverlay.show{ transform: translateY(0); }
  .search-hdr{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding: calc(14px + env(safe-area-inset-top)) 12px 14px; background: var(--rust-dark);
  }
  .search-hdr input{
    flex:1; padding:10px 12px; border-radius:8px; border:none; font-size:1rem;
    font-family: inherit; background:#fff8ea;
  }
  .search-hdr .hdr-title-mini{ flex:1; color:#fdf3e2; font-weight:bold; font-size:1rem; }
  .hdr-mini-btn{
    background:none; border:1px solid rgba(255,255,255,0.5); color:#fdf3e2;
    font-size:0.78rem; padding:7px 11px; border-radius:6px; cursor:pointer;
    white-space:nowrap; font-family:inherit; flex:0 0 auto;
  }
  .search-results{ flex:1; overflow-y:auto; background: var(--paper); padding: 6px 0; }
  .search-item{ position:relative; padding: 12px 44px 12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .search-item:active{ background: var(--paper-soft); }
  .search-item .si-loc{ font-size:0.72rem; color: var(--rust-dark); margin-bottom:3px; }
  .search-item .si-text{ font-size:0.9rem; color: var(--ink); line-height:1.4; }
  .search-item mark{ background: #f4d98a; color: inherit; }
  .search-item .si-del{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    color:#a33; font-size:1.15rem; padding:8px; line-height:1;
  }
  .search-empty{ padding: 24px; text-align:center; color: var(--ink-soft); }

  /* ---------- Loader ---------- */
  #loaderScreen{
    position:fixed; inset:0; z-index:50; background: var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
    color: #f2e3c5;
    padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align:center;
  }
  #loaderScreen h1{ font-size:1.4rem; color: var(--gold); margin:0; }
  #loaderScreen p{ color:#c9b98c; font-size:0.9rem; max-width:340px; margin:0; }
  .load-btn{
    background: var(--rust); color:#fff; border:none; padding: 13px 26px;
    border-radius: 8px; font-size:1rem; cursor:pointer;
  }
  .hidden{ display:none !important; }
</style>
</head>

<script>
  // Each datafiles/NNname.js declares "var <Name> = [[...], ...]" — a top-level
  // var DOES attach to window (unlike const/let), so window[name] safely reads
  // it whether or not that particular file has been uploaded yet. Files not
  // yet present (08–15 initially) are simply skipped; this list is in strict
  // parva order (01–18) so the combined array stays correctly ordered no
  // matter which files exist yet, and adding a missing one later never shifts
  // any padyam that comes before it.
  //
  // dataupdatedOn.js (optional, added later) declares "var dataUpdatedOn = 'DDMMYYYY';"
  // — used only as a cheap "did the data change" check for the IndexedDB backup cache.
  var PARVA_VAR_NAMES = [
    'Adi','sabhA','AraNya','virATa','udyOga','bhIShma','drONa','karNa','Salya',
    'sauptika','strI','SAMti','AnuSAsanika','aSvamEdha','ASramavAsa',
    'mausala','mahAprasthAnika','svargArOhaNa'
  ];
  var padyams = [];
  PARVA_VAR_NAMES.forEach(function(name){
    var arr = window[name];
    if(Array.isArray(arr) && arr.length) padyams = padyams.concat(arr);
  });
</script>
<script>
(function(){
  "use strict";

  // ------------------------------------------------------------------
  // IndexedDB (replaces localStorage for all persisted state)
  // ------------------------------------------------------------------
  const DB_NAME = 'mbhReaderDB';
  const DB_VERSION = 1;
  const DB_STORE = 'kv';

  let dbPromise = null;
  function idbOpen(){
    return new Promise(function(resolve, reject){
      if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(){
        const db = req.result;
        if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function getDb(){
    if(!dbPromise) dbPromise = idbOpen();
    return dbPromise;
  }
  function idbGet(key){
    return getDb().then(function(db){
      return new Promise(function(resolve, reject){
        const tx = db.transaction(DB_STORE, 'readonly');
        const req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    }).catch(function(){ return undefined; });
  }
  function idbSet(key, value){
    return getDb().then(function(db){
      return new Promise(function(resolve, reject){
        const tx = db.transaction(DB_STORE, 'readwrite');
        const req = tx.objectStore(DB_STORE).put(value, key);
        req.onsuccess = function(){ resolve(true); };
        req.onerror = function(){ reject(req.error); };
      });
    }).catch(function(){ return false; });
  }

  // ------------------------------------------------------------------
  // State
  // ------------------------------------------------------------------
  const MEANING_LABELS = { ardha: 'అర్థం', bhava: 'భావం', visesha: 'విశేషం' };

  let rawData = [];         // parsed rows as produced by the datafiles
  let screens = [];         // flattened list of {parva, aswasam, topic, number, type, parts, text, textNorm, ardha, bhava, visesha}
  let topics = [];          // list of {parva, aswasam, topicLabel, keyStr, indices:[padyamIdx,...]}
  let padyamToTopicIndex = []; // padyamIdx -> topicIdx

  let viewMode = 'padyam';  // 'padyam' | 'topic'
  let currentIndex = 0;     // index into screens[] (padyam mode) or topics[] (topic mode)
  let fontScale = 1.0;
  let fontFamily = 'Mandali'; // 'Mandali' | 'NTR'
  let activeMeaningTab = 'bhava'; // 'ardha' | 'bhava' | 'visesha'
  let starredMap = {};      // padyamKey -> {parva, aswasam, number, type, snippet}

  // "Primary bookmark" = the position normal browsing (prev/next/swipe/TOC)
  // last left off at. It doubles as the resume-on-reopen position.
  let primary = { mode: 'padyam', key: null };
  let awayFromPrimary = false; // true after jumping in via search/starred results

  let touchStartX = 0, touchStartY = 0, dragging = false, dragDX = 0;
  let renderedIdx = new Set();

  // ------------------------------------------------------------------
  // DOM refs
  // ------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const track = $('track');
  const hdrSub = $('hdrSub');
  const progressEl = $('progress');
  const prevBtn = $('prevBtn');
  const nextBtn = $('nextBtn');
  const overlay = $('overlay');
  const drawer = $('drawer');
  const navTreeEl = $('navTree');
  const fontLabel = $('fontLabel');
  const awayBanner = $('awayBanner');
  const searchOverlay = $('searchOverlay');
  const searchInput = $('searchInput');
  const searchResults = $('searchResults');
  const starredOverlay = $('starredOverlay');
  const starredResults = $('starredResults');
  const loaderScreen = $('loaderScreen');
  const loaderStatus = $('loaderStatus');
  const retryBtn = $('retryBtn');
  const stage = $('stage');

  // ------------------------------------------------------------------
  // Data loading
  // ------------------------------------------------------------------
  function normalizeWs(s){
    return String(s || '').replace(/\s+/g, ' ').trim();
  }

  // Removes bracketed/parenthesized content (and any digits inside it),
  // used to clean topic headers like "శకుంతలోపాఖ్యానము (1-40)" -> "శకుంతలోపాఖ్యానము".
  function cleanTopicLabel(s){
    return normalizeWs(String(s || '').replace(/[\(\[（【][^\)\]）】]*[\)\]）】]/g, ''));
  }

  // Converts the flat row format
  // [parva, aswasam, header, number, type, text, ardha, bhava, visesha]
  // (the last three are optional, added later) into screen objects. When a
  // "సీ." (Seesam) row has no number, it is always immediately followed by
  // its tail verse (ఆ. or తే.) which carries the real number — the two rows
  // are merged into a single padyam with two display parts.
  function flattenRows(rows){
    const out = [];
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const parva = normalizeWs(r[0]);
      const aswasam = normalizeWs(r[1]);
      const topic = r[2] || '';
      const number = r[3] || '';
      const type = r[4] || '';
      const text = r[5] || '';
      const ardha = r[6] || '';
      const bhava = r[7] || '';
      const visesha = r[8] || '';

      if(type === 'సీ.' && !number && rows[i + 1]){
        const next = rows[i + 1];
        const combinedText = text + '\n' + (next[5] || '');
        out.push({
          parva: parva, aswasam: aswasam, topic: topic,
          number: next[3] || '',
          type: type,
          parts: [
            { type: type, lines: text.split('\n'), text: text },
            { type: next[4] || '', lines: (next[5] || '').split('\n'), text: next[5] || '' }
          ],
          text: combinedText,
          textNorm: combinedText.normalize('NFC').toLowerCase(),
          ardha: next[6] || ardha,
          bhava: next[7] || bhava,
          visesha: next[8] || visesha
        });
        i++; // the tail row was consumed as part of this padyam
        continue;
      }

      out.push({
        parva: parva, aswasam: aswasam, topic: topic,
        number: number, type: type,
        parts: [{ type: type, lines: text.split('\n'), text: text }],
        text: text,
        textNorm: text.normalize('NFC').toLowerCase(),
        ardha: ardha, bhava: bhava, visesha: visesha
      });
    }
    return out;
  }

  function padyamKey(s){
    return s.parva + '|' + s.aswasam + '|' + s.number + '|' + s.type;
  }

  async function loadDataInto(rows){
    rawData = rows;
    screens = flattenRows(rows);
    if(screens.length === 0){
      alert('పద్యాలు కనబడలేదు (No padyams found).');
      return false;
    }
    loaderScreen.classList.add('hidden');
    buildNavTree(); // also builds topics[] / padyamToTopicIndex[]

    starredMap = (await idbGet('starred_v1')) || {};
    const savedPrimary = await idbGet('primary_v1');
    if(savedPrimary && savedPrimary.key && (savedPrimary.mode === 'padyam' || savedPrimary.mode === 'topic')){
      primary = savedPrimary;
    }

    if(primary.key){
      viewMode = primary.mode;
      currentIndex = resolvePrimaryIndex();
    } else {
      viewMode = 'padyam';
      currentIndex = 0;
      primary = { mode: viewMode, key: currentKeyForIndex(viewMode, currentIndex) };
      idbSet('primary_v1', primary);
    }
    awayFromPrimary = false;
    updateModeToggleUI();

    renderTrack();
    goTo(currentIndex, false);
    return true;
  }

  async function autoLoadFromServer(){
    // "padyams" is built just above from all available datafiles/*.js files
    // (each declares a top-level "var <Name>" which attaches to window, so
    // partial uploads — e.g. only some parvas present — degrade gracefully).
    if(typeof padyams !== 'undefined' && Array.isArray(padyams) && padyams.length){
      const newDate = (typeof dataUpdatedOn !== 'undefined') ? dataUpdatedOn : null;
      try{
        const cachedDate = await idbGet('dataUpdatedOn_v1');
        if(!newDate || newDate !== cachedDate){
          // Data has changed (or we can't tell) — refresh the IndexedDB backup.
          await idbSet('data_v2', padyams);
          if(newDate) await idbSet('dataUpdatedOn_v1', newDate);
        }
      }catch(e){ /* IndexedDB unavailable — reader still works this session */ }
      return await loadDataInto(padyams);
    }
    return false;
  }

  async function tryRestoreFromCache(){
    try{
      const cached = await idbGet('data_v2');
      if(cached && cached.length) return await loadDataInto(cached);
    }catch(e){ /* ignore corrupt/missing cache */ }
    return false;
  }

  retryBtn.addEventListener('click', function(){ window.location.reload(); });

  // ------------------------------------------------------------------
  // Rendering helpers
  // ------------------------------------------------------------------
  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderParts(s){
    return s.parts.map(function(pt){
      return '<div class="verse-part">' +
        (s.parts.length > 1 ? '<div class="ptype">' + escapeHtml(pt.type) + '</div>' : '') +
        '<div class="verse-text">' + escapeHtml(pt.lines ? pt.lines.join('\n') : pt.text) + '</div>' +
        '</div>';
    }).join('');
  }

  function meaningContentHtml(s, tab){
    const val = s[tab];
    if(val) return '<div class="meaning-text">' + escapeHtml(val) + '</div>';
    return '<div class="meaning-empty">' + MEANING_LABELS[tab] + ' అందుబాటులో లేదు.</div>';
  }

  function activeCount(){
    return viewMode === 'topic' ? topics.length : screens.length;
  }

  function currentKeyForIndex(mode, idx){
    return mode === 'topic' ? topics[idx].keyStr : padyamKey(screens[idx]);
  }

  // ---- padyam-wise screen: verse + ardha/bhava/visesha tabs ----
  function renderScreen(s, idx){
    const starred = !!starredMap[padyamKey(s)];
    const tabsHtml = ['ardha', 'bhava', 'visesha'].map(function(tab){
      return '<button class="meaning-tab-btn ' + (activeMeaningTab === tab ? 'active' : '') +
        '" data-tab="' + tab + '">' + MEANING_LABELS[tab] + '</button>';
    }).join('');

    const div = document.createElement('div');
    div.className = 'screen';
    div.innerHTML =
      '<div class="verse-pane">' +
        '<div class="verse-meta">' +
          (s.number ? '<span class="verse-badge">#' + escapeHtml(s.number) + '</span>' : '') +
          '<span class="verse-type">' + escapeHtml(s.type || '') + '</span>' +
          '<button class="verse-star ' + (starred ? 'on' : '') + '" data-idx="' + idx + '">★</button>' +
        '</div>' +
        renderParts(s) +
      '</div>' +
      '<div class="resize-handle"></div>' +
      '<div class="meaning-pane">' +
        '<div class="meaning-tabs">' + tabsHtml + '</div>' +
        '<div class="meaning-content">' + meaningContentHtml(s, activeMeaningTab) + '</div>' +
      '</div>';
    return div;
  }

  // ---- topic-wise screen: every padyam's verse text in the topic, stacked
  //      (no ardha/bhava/visesha here, by design) ----
  function renderTopicScreen(t, idx){
    const blocksHtml = t.indices.map(function(padIdx){
      const s = screens[padIdx];
      const starred = !!starredMap[padyamKey(s)];
      return '<div class="topic-block">' +
        '<div class="verse-meta">' +
          (s.number ? '<span class="verse-badge">#' + escapeHtml(s.number) + '</span>' : '') +
          '<span class="verse-type">' + escapeHtml(s.type || '') + '</span>' +
          '<button class="verse-star ' + (starred ? 'on' : '') + '" data-idx="' + padIdx + '">★</button>' +
        '</div>' +
        renderParts(s) +
      '</div>';
    }).join('');

    const div = document.createElement('div');
    div.className = 'screen topic-screen';
    div.innerHTML =
      '<div class="topic-scroll">' +
        '<div class="topic-hdr">' + escapeHtml(t.aswasam) + (t.topicLabel ? ' · ' + escapeHtml(t.topicLabel) : '') + '</div>' +
        blocksHtml +
      '</div>';
    return div;
  }

  function renderTrack(){
    track.innerHTML = '';
    renderedIdx = new Set();
    const count = activeCount();
    for(let i = 0; i < count; i++){
      const placeholder = document.createElement('div');
      placeholder.className = 'screen';
      placeholder.dataset.idx = i;
      track.appendChild(placeholder);
    }
    applyFontScale();
    renderVisibleRange();
  }

  function renderVisibleRange(){
    const count = activeCount();
    const lo = Math.max(0, currentIndex - 1);
    const hi = Math.min(count - 1, currentIndex + 1);
    for(let i = lo; i <= hi; i++){
      if(renderedIdx.has(i)) continue;
      const real = viewMode === 'topic' ? renderTopicScreen(topics[i], i) : renderScreen(screens[i], i);
      real.dataset.idx = i;
      if(track.children[i]) track.replaceChild(real, track.children[i]);
      renderedIdx.add(i);
    }
  }

  function applyFontScale(){
    document.documentElement.style.setProperty('--verse-size', (1.15 * fontScale) + 'rem');
    fontLabel.textContent = Math.round(fontScale * 100) + '%';
  }

  function applyFontFamily(){
    document.documentElement.style.setProperty('--reader-font', "'" + fontFamily + "'");
    $('fontMandaliBtn').classList.toggle('active', fontFamily === 'Mandali');
    $('fontNTRBtn').classList.toggle('active', fontFamily === 'NTR');
  }

  function updateHeader(){
    if(viewMode === 'topic'){
      const t = topics[currentIndex];
      if(!t) return;
      hdrSub.textContent = t.aswasam + (t.topicLabel ? ' · ' + t.topicLabel : '');
    } else {
      const s = screens[currentIndex];
      if(!s) return;
      hdrSub.textContent = s.aswasam + (s.topic ? ' · ' + s.topic : '');
    }
  }

  function updateProgress(){
    const count = activeCount();
    progressEl.innerHTML = '<b>' + (currentIndex + 1) + '</b> / ' + count;
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === count - 1;
  }

  function updateAwayBanner(){
    awayBanner.classList.toggle('hidden', !awayFromPrimary);
  }

  // ------------------------------------------------------------------
  // Primary bookmark
  // ------------------------------------------------------------------
  function resolvePrimaryIndex(){
    if(primary.mode === 'topic'){
      for(let i = 0; i < topics.length; i++){ if(topics[i].keyStr === primary.key) return i; }
    } else {
      for(let i = 0; i < screens.length; i++){ if(padyamKey(screens[i]) === primary.key) return i; }
    }
    return 0; // data changed since this was saved — fall back to the start
  }

  // ------------------------------------------------------------------
  // Navigation
  // ------------------------------------------------------------------
  function goTo(idx, animate){
    const count = activeCount();
    if(idx < 0 || idx >= count) return;
    currentIndex = idx;
    renderVisibleRange();
    const x = -idx * 100;
    track.style.transition = animate === false ? 'none' : 'transform 0.28s ease';
    track.style.transform = 'translateX(' + x + '%)';
    updateHeader();
    updateProgress();

    if(!awayFromPrimary){
      // Normal browsing (prev/next/swipe/TOC): this becomes the new primary bookmark.
      primary = { mode: viewMode, key: currentKeyForIndex(viewMode, idx) };
      idbSet('primary_v1', primary);
    } else if(viewMode === primary.mode && currentKeyForIndex(viewMode, idx) === primary.key){
      // Swiped/navigated back to exactly the primary bookmark — end the excursion.
      awayFromPrimary = false;
    }
    updateAwayBanner();
    highlightNavTreeCurrent();
  }

  // Used by search results / starred items: always lands in padyam-wise mode,
  // and starts (or continues) an excursion that leaves the primary bookmark
  // untouched until the user explicitly returns to it (or swipes back onto it).
  function navigateAway(padyamIdx){
    if(viewMode !== 'padyam'){
      viewMode = 'padyam';
      renderTrack();
    }
    awayFromPrimary = true;
    goTo(padyamIdx, true);
  }

  function goToPrimary(){
    if(viewMode !== primary.mode){
      viewMode = primary.mode;
      renderTrack();
    }
    awayFromPrimary = false;
    goTo(resolvePrimaryIndex(), true);
    updateModeToggleUI();
  }
  $('goPrimaryBtn').addEventListener('click', goToPrimary);

  // ------------------------------------------------------------------
  // View mode toggle (padyam-wise / topic-wise)
  // ------------------------------------------------------------------
  function updateModeToggleUI(){
    $('modePadyamBtn').classList.toggle('active', viewMode === 'padyam');
    $('modeTopicBtn').classList.toggle('active', viewMode === 'topic');
  }
  function setViewMode(mode){
    if(mode === viewMode) return;
    if(mode === 'topic'){
      const topicIdx = padyamToTopicIndex[currentIndex] != null ? padyamToTopicIndex[currentIndex] : 0;
      viewMode = 'topic';
      renderTrack();
      goTo(topicIdx, false);
    } else {
      const t = topics[currentIndex];
      const padIdx = (t && t.indices.length) ? t.indices[0] : 0;
      viewMode = 'padyam';
      renderTrack();
      goTo(padIdx, false);
    }
    updateModeToggleUI();
  }
  $('modePadyamBtn').addEventListener('click', function(){ setViewMode('padyam'); });
  $('modeTopicBtn').addEventListener('click', function(){ setViewMode('topic'); });

  // ------------------------------------------------------------------
  // Nav buttons + keyboard
  // ------------------------------------------------------------------
  prevBtn.addEventListener('click', function(){ goTo(currentIndex - 1); });
  nextBtn.addEventListener('click', function(){ goTo(currentIndex + 1); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft') goTo(currentIndex - 1);
    if(e.key === 'ArrowRight') goTo(currentIndex + 1);
    if(e.key === 'Escape'){ closeDrawer(); closeSearch(); closeStarred(); }
  });

  // ------------------------------------------------------------------
  // Swipe handling (horizontal-dominant only, so vertical scroll in
  // verse/meaning panes keeps working)
  // ------------------------------------------------------------------
  stage.addEventListener('touchstart', function(e){
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    dragging = true; dragDX = 0;
  }, {passive:true});

  stage.addEventListener('touchmove', function(e){
    if(!dragging) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if(Math.abs(dx) > Math.abs(dy)){
      dragDX = dx;
      const base = -currentIndex * 100;
      const pct = (dx / stage.clientWidth) * 100;
      track.style.transition = 'none';
      track.style.transform = 'translateX(' + (base + pct) + '%)';
    }
  }, {passive:true});

  stage.addEventListener('touchend', function(){
    if(!dragging) return;
    dragging = false;
    const count = activeCount();
    const threshold = stage.clientWidth * 0.18;
    if(dragDX > threshold && currentIndex > 0){
      goTo(currentIndex - 1);
    } else if(dragDX < -threshold && currentIndex < count - 1){
      goTo(currentIndex + 1);
    } else {
      goTo(currentIndex, true);
    }
    dragDX = 0;
  });

  // ------------------------------------------------------------------
  // Track click delegation: star toggle + meaning-tab switch
  // ------------------------------------------------------------------
  track.addEventListener('click', function(e){
    const tabBtn = e.target.closest('.meaning-tab-btn');
    if(tabBtn){
      activeMeaningTab = tabBtn.dataset.tab;
      idbSet('meaningTab_v1', activeMeaningTab);
      renderedIdx = new Set();
      renderVisibleRange();
      return;
    }
    const starBtn = e.target.closest('.verse-star');
    if(starBtn){
      const idx = Number(starBtn.dataset.idx);
      const s = screens[idx];
      const key = padyamKey(s);
      if(starredMap[key]){
        delete starredMap[key];
      } else {
        starredMap[key] = {
          parva: s.parva, aswasam: s.aswasam, number: s.number, type: s.type,
          snippet: (s.text || '').replace(/\n/g, ' ').slice(0, 70)
        };
      }
      saveStarred();
      starBtn.classList.toggle('on');
    }
  });

  function saveStarred(){ idbSet('starred_v1', starredMap); }

  function findScreenIndexByKey(key){
    for(let i = 0; i < screens.length; i++){ if(padyamKey(screens[i]) === key) return i; }
    return -1;
  }

  function renderStarredList(){
    const keys = Object.keys(starredMap);
    starredResults.innerHTML = '';
    if(keys.length === 0){
      starredResults.innerHTML = '<div class="search-empty">స్టార్ చేసిన పద్యాలు లేవు</div>';
      return;
    }
    keys.forEach(function(key){
      const item = starredMap[key];
      const div = document.createElement('div');
      div.className = 'search-item';
      div.innerHTML =
        '<div class="si-loc">' + escapeHtml(item.aswasam) + (item.number ? ' · #' + escapeHtml(item.number) : '') + '</div>' +
        '<div class="si-text">' + escapeHtml(item.snippet) + '</div>' +
        '<span class="si-del" data-key="' + escapeHtml(key) + '">✕</span>';
      div.addEventListener('click', function(e){
        if(e.target.classList.contains('si-del')){
          delete starredMap[key];
          saveStarred();
          renderStarredList();
          renderedIdx = new Set();
          renderVisibleRange();
          return;
        }
        closeStarred();
        const idx = findScreenIndexByKey(key);
        if(idx !== -1) navigateAway(idx);
      });
      starredResults.appendChild(div);
    });
  }

  function openStarred(){
    closeSearch();
    starredOverlay.classList.add('show');
    renderStarredList();
  }
  function closeStarred(){ starredOverlay.classList.remove('show'); }
  $('starredMenuBtn').addEventListener('click', function(){ closeDrawer(); openStarred(); });
  $('closeStarredBtn').addEventListener('click', closeStarred);
  $('clearStarredBtn').addEventListener('click', function(){
    if(!Object.keys(starredMap).length) return;
    if(!window.confirm('అన్ని స్టార్ చేసిన పద్యాలను తొలగించాలా?')) return;
    starredMap = {};
    saveStarred();
    renderStarredList();
    renderedIdx = new Set();
    renderVisibleRange();
  });

  // ------------------------------------------------------------------
  // Drawer (hamburger menu)
  // ------------------------------------------------------------------
  function openDrawer(){ overlay.classList.add('show'); drawer.classList.add('show'); }
  function closeDrawer(){ overlay.classList.remove('show'); drawer.classList.remove('show'); }
  $('menuBtn').addEventListener('click', openDrawer);
  $('closeDrawerBtn').addEventListener('click', closeDrawer);
  overlay.addEventListener('click', function(){ closeDrawer(); closeSearch(); closeStarred(); });

  function buildNavTree(){
    // Group screens into parva -> aswasam(by NAME, spans multiple source pages/files) -> topic,
    // preserving first-seen order. Also builds the flat topics[] list (one entry
    // per topic bucket, in the same first-seen order) and padyamToTopicIndex[]
    // used by topic-wise mode.
    topics = [];
    padyamToTopicIndex = new Array(screens.length);

    const parvaOrder = [];
    const parvaMap = new Map();
    screens.forEach(function(s, idx){
      let pv = parvaMap.get(s.parva);
      if(!pv){
        pv = { count:0, aswasamOrder:[], aswasams:new Map() };
        parvaMap.set(s.parva, pv);
        parvaOrder.push(s.parva);
      }
      pv.count++;

      const aswKey = s.aswasam || 'ఆశ్వాసము';
      let asw = pv.aswasams.get(aswKey);
      if(!asw){
        asw = { label: aswKey, count:0, firstIdx: idx, topicOrder:[], topics:new Map() };
        pv.aswasams.set(aswKey, asw);
        pv.aswasamOrder.push(aswKey);
      }
      asw.count++;

      const topicKey = cleanTopicLabel(s.topic) || '—';
      let tp = asw.topics.get(topicKey);
      if(!tp){
        const topicIndex = topics.length;
        tp = { label: topicKey, count:0, firstIdx: idx, topicIndex: topicIndex };
        asw.topics.set(topicKey, tp);
        asw.topicOrder.push(topicKey);
        topics.push({
          parva: s.parva, aswasam: aswKey, topicLabel: topicKey,
          keyStr: s.parva + '|' + aswKey + '|' + topicKey,
          indices: []
        });
      }
      tp.count++;
      topics[tp.topicIndex].indices.push(idx);
      padyamToTopicIndex[idx] = tp.topicIndex;
    });

    navTreeEl.innerHTML = '';
    parvaOrder.forEach(function(parvaName){
      const pv = parvaMap.get(parvaName);
      const parvaDetails = document.createElement('details');
      parvaDetails.className = 'nav-parva';
      parvaDetails.open = parvaOrder.length === 1;

      const parvaSummary = document.createElement('summary');
      parvaSummary.innerHTML =
        '<span class="nav-label">' + escapeHtml(parvaName) + '</span>' +
        '<span class="nav-count">(' + pv.count + ')</span>';
      parvaDetails.appendChild(parvaSummary);

      pv.aswasamOrder.forEach(function(aswKey){
        const asw = pv.aswasams.get(aswKey);
        const aswDetails = document.createElement('details');
        aswDetails.className = 'nav-aswasam';
        aswDetails.dataset.aswasam = aswKey;

        const aswSummary = document.createElement('summary');
        aswSummary.innerHTML =
          '<span class="nav-label">' + escapeHtml(asw.label) + '</span>' +
          '<span class="nav-count">(' + asw.count + ')</span>';
        aswDetails.appendChild(aswSummary);

        const topicList = document.createElement('ul');
        topicList.className = 'nav-topics';
        asw.topicOrder.forEach(function(topicKey, i){
          const tp = asw.topics.get(topicKey);
          const li = document.createElement('li');
          li.dataset.idx = tp.firstIdx;
          li.dataset.topicKey = topicKey;
          li.innerHTML =
            '<span class="nav-label">' + (i + 1) + '. ' + escapeHtml(tp.label) + '</span>' +
            '<span class="nav-count">(' + tp.count + ')</span>';
          li.addEventListener('click', function(){
            closeDrawer();
            awayFromPrimary = false; // TOC navigation is "normal" browsing, like prev/next
            if(viewMode === 'topic') goTo(tp.topicIndex, true);
            else goTo(tp.firstIdx, true);
          });
          topicList.appendChild(li);
        });
        aswDetails.appendChild(topicList);
        parvaDetails.appendChild(aswDetails);
      });

      navTreeEl.appendChild(parvaDetails);
    });

    highlightNavTreeCurrent();
  }

  function highlightNavTreeCurrent(){
    if(!navTreeEl.children.length) return;
    let currentAswasam, currentTopicKey;
    if(viewMode === 'topic'){
      const t = topics[currentIndex];
      if(!t) return;
      currentAswasam = t.aswasam;
      currentTopicKey = t.topicLabel;
    } else {
      const s = screens[currentIndex];
      if(!s) return;
      currentAswasam = s.aswasam || 'ఆశ్వాసము';
      currentTopicKey = cleanTopicLabel(s.topic) || '—';
    }
    Array.from(navTreeEl.querySelectorAll('.nav-aswasam')).forEach(function(aswEl){
      const isCurrentAswasam = aswEl.dataset.aswasam === currentAswasam;
      if(isCurrentAswasam) aswEl.open = true;
      Array.from(aswEl.querySelectorAll('.nav-topics > li')).forEach(function(li){
        li.classList.toggle('current', isCurrentAswasam && li.dataset.topicKey === currentTopicKey);
      });
    });
  }

  // ------------------------------------------------------------------
  // Font size + font family controls
  // ------------------------------------------------------------------
  $('fontPlus').addEventListener('click', function(){
    fontScale = Math.min(2, Math.round((fontScale + 0.1) * 10) / 10);
    applyFontScale(); idbSet('fontScale_v1', fontScale);
  });
  $('fontMinus').addEventListener('click', function(){
    fontScale = Math.max(0.7, Math.round((fontScale - 0.1) * 10) / 10);
    applyFontScale(); idbSet('fontScale_v1', fontScale);
  });
  function setFontFamily(f){
    fontFamily = f;
    applyFontFamily();
    idbSet('fontFamily_v1', fontFamily);
  }
  $('fontMandaliBtn').addEventListener('click', function(){ setFontFamily('Mandali'); });
  $('fontNTRBtn').addEventListener('click', function(){ setFontFamily('NTR'); });

  // ------------------------------------------------------------------
  // Search (persistent, padyam-text-only, Telugu Unicode NFC-aware)
  // ------------------------------------------------------------------
  let searchTerm = '';

  function openSearch(){
    closeStarred();
    searchOverlay.classList.add('show');
    searchInput.value = searchTerm;
    runSearch();
    setTimeout(function(){ searchInput.focus(); }, 260);
  }
  function closeSearch(){ searchOverlay.classList.remove('show'); }
  $('searchBtn').addEventListener('click', openSearch);
  $('closeSearchBtn').addEventListener('click', closeSearch);
  $('clearSearchBtn').addEventListener('click', function(){
    searchTerm = '';
    searchInput.value = '';
    searchResults.innerHTML = '';
    searchInput.focus();
  });

  let searchDebounce = null;
  searchInput.addEventListener('input', function(){
    searchTerm = searchInput.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(runSearch, 150);
  });

  function runSearch(){
    const q = searchTerm.trim();
    if(q.length < 1){ searchResults.innerHTML = ''; return; }
    // Normalize the query the same way padyam text was normalized at load
    // time, so Telugu vowel-sign/conjunct encoding differences don't cause
    // false misses. Matches padyam text only (not topic/aswasam/number).
    const qn = q.normalize('NFC').toLowerCase();
    const matches = [];
    for(let i = 0; i < screens.length && matches.length < 60; i++){
      if(screens[i].textNorm.indexOf(qn) !== -1) matches.push(i);
    }
    if(matches.length === 0){
      searchResults.innerHTML = '<div class="search-empty">ఫలితాలు లేవు</div>';
      return;
    }
    searchResults.innerHTML = '';
    matches.forEach(function(idx){
      const s = screens[idx];
      const snippet = highlightMatch(s.text.replace(/\n/g, ' ').slice(0, 140), qn);
      const div = document.createElement('div');
      div.className = 'search-item';
      div.innerHTML =
        '<div class="si-loc">' + escapeHtml(s.aswasam) + (s.number ? ' · #' + escapeHtml(s.number) : '') + '</div>' +
        '<div class="si-text">' + snippet + '</div>';
      div.addEventListener('click', function(){
        closeSearch();
        navigateAway(idx);
      });
      searchResults.appendChild(div);
    });
  }
  function highlightMatch(text, qn){
    const esc = escapeHtml(text);
    if(!qn) return esc;
    const idx = esc.normalize('NFC').toLowerCase().indexOf(qn);
    if(idx === -1) return esc;
    return esc.slice(0, idx) + '<mark>' + esc.slice(idx, idx + qn.length) + '</mark>' + esc.slice(idx + qn.length);
  }

  // ------------------------------------------------------------------
  // Resize handle: drag to adjust verse/meaning pane split (padyam-wise only)
  // ------------------------------------------------------------------
  let resizingActive = false, resizeStartY = 0;
  document.addEventListener('mousedown', handleResizeStart);
  document.addEventListener('touchstart', handleResizeStart, {passive:true});
  function handleResizeStart(e){
    if(!e.target.classList || !e.target.classList.contains('resize-handle')) return;
    resizingActive = true;
    const point = e.touches ? e.touches[0] : e;
    resizeStartY = point.clientY;
  }
  document.addEventListener('mousemove', handleResizeMove);
  document.addEventListener('touchmove', handleResizeMove, {passive:true});
  function handleResizeMove(e){
    if(!resizingActive) return;
    const point = e.touches ? e.touches[0] : e;
    const dy = point.clientY - resizeStartY;
    const screenEl = track.children[currentIndex];
    if(!screenEl) return;
    const versePane = screenEl.querySelector('.verse-pane');
    const meaningPane = screenEl.querySelector('.meaning-pane');
    if(!versePane || !meaningPane) return;
    const totalH = screenEl.clientHeight - 14;
    let verseH = versePane.clientHeight + dy;
    verseH = Math.max(totalH * 0.2, Math.min(totalH * 0.8, verseH));
    versePane.style.flex = '0 0 ' + verseH + 'px';
    meaningPane.style.flex = '1 1 auto';
    resizeStartY = point.clientY;
  }
  document.addEventListener('mouseup', function(){ resizingActive = false; });
  document.addEventListener('touchend', function(){ resizingActive = false; });

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  (async function boot(){
    fontScale = (await idbGet('fontScale_v1')) || 1.0;
    fontFamily = (await idbGet('fontFamily_v1')) || 'Mandali';
    activeMeaningTab = (await idbGet('meaningTab_v1')) || 'bhava';
    applyFontScale();
    applyFontFamily();

    const ok = await autoLoadFromServer();
    if(!ok){
      const cacheOk = await tryRestoreFromCache();
      if(!cacheOk){
        loaderStatus.textContent = 'డేటా లోడ్ కాలేదు. ఇంటర్నెట్ కనెక్షన్‌ని తనిఖీ చేయండి.';
        retryBtn.classList.remove('hidden');
      }
    }

    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('sw.js').catch(function(){ /* offline support unavailable; app still works online */ });
      });
    }
  })();

  window.addEventListener('resize', function(){ goTo(currentIndex, false); });
})();
</script>

</body>
